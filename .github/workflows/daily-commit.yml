name: Daily automated commit

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          echo "Last automated update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > daily-log.txt

      - name: Commit changes
        run: |
          git config user.name "harshitsingh070"
          git config user.email "103819233+harshitsingh070@users.noreply.github.com"
          git add daily-log.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Time Update"
          git push
